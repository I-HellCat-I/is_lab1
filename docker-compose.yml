version: '3.8'

services:
  # Наш фронтенд на Nginx - это точка входа для пользователя
  frontend:
    build:
      context: ./frontend
    ports:
      # Мы открываем порт 8081 наружу, чтобы не конфликтовать с 8080 от бэкенда
      - "8081:80"
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: movie_rabbitmq
    ports:
      - "5672:5672"   # Порт для общения приложений
      - "15672:15672" # Веб-интерфейс (http://localhost:15672, guest/guest)
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: movie_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      cache_from:
        - gradle_cache:/home/gradle/.gradle
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_TYPE: com.alibaba.druid.pool.DruidDataSource
      SPRING_DATASOURCE_DRUID_INITIAL-SIZE: 5
      SPRING_DATASOURCE_DRUID_MIN-IDLE: 5
      SPRING_DATASOURCE_DRUID_MAX-ACTIVE: 20
      SPRING_DATASOURCE_DRUID_MAX-WAIT: 60000
      SPRING_DATASOURCE_DRUID_TEST-ON-BORROW: true
      SPRING_DATASOURCE_DRUID_VALIDATION-QUERY: SELECT 1

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: movie-imports

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/moviedb?stringtype=unspecified&reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: movieuser
      SPRING_DATASOURCE_PASSWORD: moviepassword

      SPRING_JPA_DATABASE-PLATFORM: org.eclipse.persistence.platform.database.PostgreSQLPlatform
      SPRING_SERVLET_MULTIPART_MAX-FILE-SIZE: 512MB
      SPRING_SERVLET_MULTIPART_MAX-REQUEST-SIZE: 512MB
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE: 60

      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: 50
      SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS: true
      SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES: true
        # Увеличиваем таймаут ожидания соединения (чтобы не падал сразу)
      SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT: 30000
      # ВАЖНО: отключаем автоматическую генерацию схемы от JPA, так как мы управляем ей сами
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate # или none
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  # Наша база данных
  db:
    image: postgres:16
    container_name: is-1_db
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepassword
    ports:
      - "54321:5432"
    volumes:
      # Важно: путь теперь относительный от docker-compose.yml
      - ./backend/db-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviedb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  gradle_cache:
  minio_data: