services:
  backend:
    build:
      context: ./kino-backend
      # Передаем build-args, чтобы asadmin знал, где искать базу
      args:
        - DB_HOST=db
        - DB_USER=comrade
        - DB_PASSWORD=secret_password
        - DB_NAME=kino_db
    ports:
      - "8080:8080" # HTTP
      - "4848:4848" # Админка Payara
    depends_on:
      db:
        condition: service_healthy # Ждем, пока БД будет готова
  # Наша база данных
  db:
    image: postgres:14-alpine

    environment:
      - POSTGRES_DB=kino_db
      - POSTGRES_USER=comrade
      - POSTGRES_PASSWORD=secret_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U comrade -d kino_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "54321:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: